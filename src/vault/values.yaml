# HashiCorp Vault Configuration
# https://github.com/hashicorp/vault-helm/blob/main/values.yaml

server:
  enabled: true

  # Run Vault in standalone mode with file storage
  # For production, consider using Raft or Consul backend
  ha:
    enabled: false

  # Resource configuration
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Data storage configuration
  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/data

  auditStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/audit

  # Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  # Ingress configuration
  ingress:
    enabled: false

  # Enable dev mode for testing only
  dev:
    enabled: false
    devRootToken: root

# UI configuration
ui:
  enabled: true
  serviceType: ClusterIP

# Injector configuration
injector:
  enabled: true
  replicas: 1

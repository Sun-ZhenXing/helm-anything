# K8ssandra Cluster Configuration
# https://github.com/k8ssandra/k8ssandra-operator

# Cluster name
cassandra:
  clusterName: cassandra-cluster
  datacenters:
    - name: dc1
      size: 3
      racks:
        - name: rack1
        - name: rack2
        - name: rack3
      storage:
        storageClassName: standard
        size: 10Gi
      resources:
        requests:
          cpu: 1000m
          memory: 4Gi
        limits:
          cpu: 2000m
          memory: 4Gi

# Stargate configuration
stargate:
  enabled: false
  size: 1
  heapSize: 256Mi

# Reaper configuration
reaper:
  enabled: false

# Medusa backup configuration
medusa:
  enabled: false

# Prometheus monitoring
monitoring:
  enabled: false

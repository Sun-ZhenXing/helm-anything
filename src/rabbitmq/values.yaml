replicaCount: 3

auth:
  password: "password" # Change me!
  erlangCookie: "erlang-cookie" # Change me!

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: rabbitmq.local
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  storageClass: local-path

resources:
  limits:
    cpu: "1"
    memory: "2Gi"
  requests:
    cpu: "0.1"
    memory: "512Mi"

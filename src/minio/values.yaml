replicaCount: 3

auth:
  rootUser: admin
  rootPassword: "root-password" # Change me: $ openssl rand -base64 12

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: minio.local
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  storageClass: local-path

resources:
  limits:
    cpu: "1"
    memory: "2Gi"
  requests:
    cpu: "0.1"
    memory: "512Mi"

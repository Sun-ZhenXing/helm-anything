mode: deployment

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}
    memory_limiter:
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    logging:
      loglevel: info

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [logging]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [logging]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [logging]

resources:
  limits:
    cpu: '1'
    memory: 2Gi
  requests:
    cpu: '0.1'
    memory: 512Mi

service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

# Default values for Rancher.
# This is a YAML-formatted file.

# Rancher server hostname (required for production)
hostname: ''

# Number of Rancher server replicas
replicas: 3

# Image configuration
image:
  repository: rancher/rancher
  tag: v2.9.2
  pullPolicy: IfNotPresent

# Ingress configuration
ingress:
  enabled: true
  includeDefaultExtraAnnotations: true
  extraAnnotations: {}
  # ingressClassName: nginx
  tls:
    # Options: rancher, letsEncrypt, secret
    source: rancher
    # secretName: tls-rancher-ingress

# Service configuration
service:
  type: ClusterIP
  # type: LoadBalancer

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Audit Log configuration
auditLog:
  enabled: false
  # level: 1
  # maxAge: 10
  # maxBackup: 10
  # maxSize: 100
  # path: /var/log/auditlog/rancher-api-audit.log

# Extra environment variables
extraEnv: []
# - name: CATTLE_SERVER_URL
#   value: "https://rancher.example.com"

# Bootstrap password (auto-generated if not set)
# bootstrapPassword: "admin"

# Private CA certificates
privateCA: false
# cacerts: ""

# Additional trusted CAs
additionalTrustedCAs: false

# Debug mode
debug: false

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

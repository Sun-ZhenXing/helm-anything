# Opik Helm Chart Values
# Documentation: https://www.comet.com/docs/opik/self-host/kubernetes/

component:
  backend:
    image:
      tag: latest
    env:
      OPIK_USAGE_REPORT_ENABLED: 'false'
      # S3_BUCKET: ""
      # S3_REGION: ""
      # AWS_ACCESS_KEY_ID: ""
      # AWS_SECRET_ACCESS_KEY: ""

  python-backend:
    image:
      tag: latest
    env:
      PYTHON_CODE_EXECUTOR_IMAGE_TAG: latest

  frontend:
    image:
      tag: latest
    ingress:
      enabled: false
      # ingressClassName: nginx
      # annotations: {}
      # hosts:
      #   - host: opik.example.com
      #     paths:
      #       - path: /
      #         port: 5173
      #         pathType: Prefix
      # tls:
      #   enabled: true
      #   hosts:
      #     - opik.example.com
      #   secretName: opik-tls

# ClickHouse configuration
clickhouse:
  enabled: true
  # replicasCount: 1
  # service:
  #   serviceTemplate: clickhouse-cluster-svc-lb-template
  #   annotations: {}

# ZooKeeper configuration (required for ClickHouse replication)
zookeeper:
  enabled: true
